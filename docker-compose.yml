services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-rag-postgres
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: enterprise-rag-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: enterprise-rag-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - rag-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: enterprise-rag-worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/uploads:/data/uploads
      - ./data/models:/data/models
    depends_on:
      - postgres
      - redis
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    networks:
      - rag-network

  embedding-service:
    build:
      context: .
      dockerfile: ml-services/embedding-service/Dockerfile
    container_name: enterprise-rag-embeddings
    env_file:
      - .env
    volumes:
      - ./data/models:/data/models
    ports:
      - "8001:8001"
    networks:
      - rag-network

  reranker-service:
    build:
      context: .
      dockerfile: ml-services/reranker-service/Dockerfile
    container_name: enterprise-rag-reranker
    env_file:
      - .env
    volumes:
      - ./data/models:/data/models
    ports:
      - "8002:8002"
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: enterprise-rag-frontend
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rag-network

volumes:
  postgres_data:
  redis_data:

networks:
  rag-network:
    driver: bridge

